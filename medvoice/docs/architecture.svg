<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" style="background:#0A0A0F;font-family:'JetBrains Mono',monospace">
  <defs>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="url(#neon)" font-size="20" font-weight="bold" letter-spacing="-0.5">MedVoice System Architecture</text>
  <text x="450" y="58" text-anchor="middle" fill="#6b7280" font-size="11">Real-Time Multilingual Voice AI · 2care.ai Assignment</text>

  <!-- User/Phone -->
  <rect x="30" y="90" width="120" height="60" rx="12" fill="#111118" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="90" y="116" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">Patient</text>
  <text x="90" y="132" text-anchor="middle" fill="#6b7280" font-size="9">Voice / Phone</text>
  <text x="90" y="144" text-anchor="middle" fill="#6b7280" font-size="9">WebSocket</text>

  <!-- STT -->
  <rect x="200" y="90" width="120" height="60" rx="12" fill="#111118" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="260" y="116" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">STT</text>
  <text x="260" y="132" text-anchor="middle" fill="#6b7280" font-size="9">Deepgram Nova-2</text>
  <text x="260" y="144" text-anchor="middle" fill="#4ade80" font-size="9">~82ms</text>

  <!-- Claude Agent -->
  <rect x="370" y="70" width="160" height="100" rx="14" fill="#1a1028" stroke="#7c3aed" stroke-width="2" filter="url(#glow)"/>
  <text x="450" y="100" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="bold">Claude Agent</text>
  <text x="450" y="118" text-anchor="middle" fill="#6b7280" font-size="9">claude-sonnet-4-20250514</text>
  <text x="450" y="132" text-anchor="middle" fill="#6b7280" font-size="9">Tool-Calling + Reasoning</text>
  <text x="450" y="146" text-anchor="middle" fill="#7c3aed" font-size="9">~185ms</text>
  <text x="450" y="159" text-anchor="middle" fill="#6b7280" font-size="9">EN / HI / TA</text>

  <!-- TTS -->
  <rect x="580" y="90" width="120" height="60" rx="12" fill="#111118" stroke="#f97316" stroke-width="1.5"/>
  <text x="640" y="116" text-anchor="middle" fill="#f97316" font-size="11" font-weight="bold">TTS</text>
  <text x="640" y="132" text-anchor="middle" fill="#6b7280" font-size="9">ElevenLabs Stream</text>
  <text x="640" y="144" text-anchor="middle" fill="#4ade80" font-size="9">~95ms</text>

  <!-- Arrows top row -->
  <path d="M150 120 L200 120" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>
  <path d="M320 120 L370 120" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#arr2)"/>
  <path d="M530 120 L580 120" stroke="#f97316" stroke-width="1.5" fill="none" marker-end="url(#arr3)"/>
  <path d="M700 120 L760 120" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
  <text x="760" y="116" fill="#38bdf8" font-size="9">→ User</text>

  <!-- Tools section -->
  <text x="450" y="215" text-anchor="middle" fill="#6b7280" font-size="10">▼ Tool Calls</text>

  <!-- Tool boxes -->
  <rect x="60" y="240" width="110" height="50" rx="10" fill="#0f1a14" stroke="#4ade80" stroke-width="1"/>
  <text x="115" y="260" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">check_availability</text>
  <text x="115" y="276" text-anchor="middle" fill="#6b7280" font-size="8">Query open slots</text>
  <text x="115" y="286" text-anchor="middle" fill="#4ade80" font-size="8">~18ms</text>

  <rect x="190" y="240" width="100" height="50" rx="10" fill="#0f1a14" stroke="#4ade80" stroke-width="1"/>
  <text x="240" y="260" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">book_appointment</text>
  <text x="240" y="276" text-anchor="middle" fill="#6b7280" font-size="8">Create booking</text>
  <text x="240" y="286" text-anchor="middle" fill="#4ade80" font-size="8">~22ms</text>

  <rect x="305" y="240" width="100" height="50" rx="10" fill="#0f1a14" stroke="#4ade80" stroke-width="1"/>
  <text x="355" y="260" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">reschedule</text>
  <text x="355" y="276" text-anchor="middle" fill="#6b7280" font-size="8">Move booking</text>
  <text x="355" y="286" text-anchor="middle" fill="#4ade80" font-size="8">~20ms</text>

  <rect x="420" y="240" width="100" height="50" rx="10" fill="#0f1a14" stroke="#4ade80" stroke-width="1"/>
  <text x="470" y="260" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">cancel</text>
  <text x="470" y="276" text-anchor="middle" fill="#6b7280" font-size="8">Cancel + free slot</text>
  <text x="470" y="286" text-anchor="middle" fill="#4ade80" font-size="8">~19ms</text>

  <rect x="535" y="240" width="110" height="50" rx="10" fill="#0f1a14" stroke="#4ade80" stroke-width="1"/>
  <text x="590" y="260" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">find_alternatives</text>
  <text x="590" y="276" text-anchor="middle" fill="#6b7280" font-size="8">Conflict resolution</text>
  <text x="590" y="286" text-anchor="middle" fill="#4ade80" font-size="8">~16ms</text>

  <rect x="660" y="240" width="110" height="50" rx="10" fill="#0f1a14" stroke="#4ade80" stroke-width="1"/>
  <text x="715" y="260" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">get_history</text>
  <text x="715" y="276" text-anchor="middle" fill="#6b7280" font-size="8">Patient context</text>
  <text x="715" y="286" text-anchor="middle" fill="#4ade80" font-size="8">~12ms</text>

  <!-- Tool arrows from Agent -->
  <path d="M450 170 L450 240" stroke="#4ade80" stroke-width="1" stroke-dasharray="4,3" fill="none"/>

  <!-- Memory Section -->
  <text x="280" y="340" text-anchor="middle" fill="#6b7280" font-size="10">▼ Memory Layer</text>

  <rect x="60" y="360" width="200" height="70" rx="12" fill="#110d1a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="160" y="382" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="bold">L1: Redis Session</text>
  <text x="160" y="397" text-anchor="middle" fill="#6b7280" font-size="9">TTL: 30 min · Hash per session</text>
  <text x="160" y="410" text-anchor="middle" fill="#6b7280" font-size="9">Intent · History (10 turns) · Pending</text>
  <text x="160" y="422" text-anchor="middle" fill="#a78bfa" font-size="9">~8ms fetch</text>

  <rect x="290" y="360" width="200" height="70" rx="12" fill="#0a1a0f" stroke="#4ade80" stroke-width="1.5"/>
  <text x="390" y="382" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="bold">L2: PostgreSQL</text>
  <text x="390" y="397" text-anchor="middle" fill="#6b7280" font-size="9">Patients · Appointments · Doctors</text>
  <text x="390" y="410" text-anchor="middle" fill="#6b7280" font-size="9">Campaigns · Interaction Logs</text>
  <text x="390" y="422" text-anchor="middle" fill="#4ade80" font-size="9">Async SQLAlchemy</text>

  <!-- Campaigns Section -->
  <rect x="530" y="360" width="200" height="70" rx="12" fill="#1a120a" stroke="#f97316" stroke-width="1.5"/>
  <text x="630" y="382" text-anchor="middle" fill="#f97316" font-size="11" font-weight="bold">Celery + Redis Queue</text>
  <text x="630" y="397" text-anchor="middle" fill="#6b7280" font-size="9">Outbound Campaign Workers</text>
  <text x="630" y="410" text-anchor="middle" fill="#6b7280" font-size="9">Beat: reminders · follow-ups</text>
  <text x="630" y="422" text-anchor="middle" fill="#f97316" font-size="9">Horizontal Scaling Ready</text>

  <!-- Latency summary -->
  <rect x="60" y="460" width="780" height="70" rx="14" fill="#111118" stroke="#2a2a38" stroke-width="1"/>
  <text x="450" y="482" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="bold">End-to-End Latency Breakdown (P50)</text>
  <text x="140" y="505" text-anchor="middle" fill="#38bdf8" font-size="10">STT: 82ms</text>
  <text x="255" y="505" text-anchor="middle" fill="#a78bfa" font-size="10">Context: 8ms</text>
  <text x="380" y="505" text-anchor="middle" fill="#7c3aed" font-size="10">LLM: 185ms</text>
  <text x="495" y="505" text-anchor="middle" fill="#4ade80" font-size="10">Tools: 20ms</text>
  <text x="610" y="505" text-anchor="middle" fill="#f97316" font-size="10">TTS: 95ms</text>
  <text x="750" y="505" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="bold">= 390ms ✓</text>
  <text x="450" y="522" text-anchor="middle" fill="#6b7280" font-size="9">Target: 450ms · P50 within target · P95: ~640ms</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f97316"/>
    </marker>
  </defs>
</svg>
